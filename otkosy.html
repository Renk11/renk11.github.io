async function toJpeg(file){
 let bmp;try{bmp=await createImageBitmap(file)}catch(e){bmp=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(file)})}
 const w0=bmp.width||bmp.naturalWidth,h0=bmp.height||bmp.naturalHeight;let max=1600,q=.8,url='';
 for(let k=0;k<6;k++){const sc=Math.min(1,max/Math.max(w0,h0)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(w0*sc));c.height=Math.max(1,Math.round(h0*sc));
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0,c.width,c.height);url=c.toDataURL('image/jpeg',q);if(url.length<=280000)break;max*=.8;q=Math.max(.5,q-.07)}
 return url}

 {n:'Плоская',item:'Другое',s:[{l:300}]}];
const B={segs:JSON.parse(JSON.stringify(PRESETS[1].s)),item:PRESETS[1].item,preset:1};let bn=0;
const num=v=>+String(v).replace(',','.');
function geo(sg,th0){let th=th0,x=0,y=0;const P=[[0,0]],H=[];sg.forEach((s,i)=>{H.push(th);x+=s.l*Math.cos(th);y-=s.l*Math.sin(th);P.push([x,y]);if(i<sg.length-1)th+=(s.d||1)*(s.a||0)*Math.PI/180});return{P,H}}
function bModel(){
 const sg=B.segs.map(s=>({l:num(s.l),a:num(s.a)||0,d:s.d||1})),len=num($('blen').value),qty=Math.max(1,Math.round(num($('bqty').value)||1));
 const ok=sg.length>0&&sg.every(s=>s.l>0)&&len>0;
 const dev=sg.reduce((a,s)=>a+(s.l||0),0),per=len*dev/1e6*C.ppm+C.make;
 return{ok,sg,len,qty,dev,area:len*dev/1e6,per,tot:per*qty}}
function bSvg(m){
 let body='';
 if(m.ok){
  let li=0;m.sg.forEach((s,i)=>{if(s.l>m.sg[li].l)li=i});
  const th0=-geo(m.sg,0).H[li],{P}=geo(m.sg,th0);
  const xs=P.map(p=>p[0]),ys=P.map(p=>p[1]),mnx=Math.min(...xs),mxx=Math.max(...xs),mny=Math.min(...ys),mxy=Math.max(...ys);
  const W=560,Hh=260,pad=52,bw=Math.max(mxx-mnx,1),bh=Math.max(mxy-mny,1),k=Math.min((W-2*pad)/bw,(Hh-2*pad-18)/bh),ox=(W-bw*k)/2-mnx*k,oy=(Hh+18-bh*k)/2-mny*k;
  const Q=P.map(p=>[p[0]*k+ox,p[1]*k+oy]);
  body+=`<polyline points="${Q.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="#f07824" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`;
  Q.forEach(p=>{body+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="#18212b"/>`});
  const T=(x,y,t,c)=>`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="15" font-family="Arial,sans-serif" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="${c}" stroke="#fff" stroke-width="4" paint-order="stroke">${t}</text>`;
  m.sg.forEach((s,i)=>{const a=Q[i],b=Q[i+1],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1;let nx=-dy/L,ny=dx/L;if(ny<-.01||(Math.abs(ny)<=.01&&nx<0)){nx=-nx;ny=-ny}
   body+=T((a[0]+b[0])/2+nx*16,(a[1]+b[1])/2+ny*16,String(+s.l.toFixed(1)).replace('.',','),'#18212b')});
  for(let i=0;i<m.sg.length-1;i++){const a=m.sg[i].a;if(!(a>0))continue;const p=Q[i+1],q0=Q[i],q1=Q[i+2];
   let ux=(q1[0]-p[0])/(Math.hypot(q1[0]-p[0],q1[1]-p[1])||1)+(q0[0]-p[0])/(Math.hypot(q0[0]-p[0],q0[1]-p[1])||1),uy=(q1[1]-p[1])/(Math.hypot(q1[0]-p[0],q1[1]-p[1])||1)+(q0[1]-p[1])/(Math.hypot(q0[1]-p[1],q0[0]-p[0])||1);
   const ul=Math.hypot(ux,uy);if(ul<.2)continue;ux/=ul;uy/=ul;body+=T(p[0]+ux*26,p[1]+uy*26,a+'°','#c4580e')}}
 const title=m.ok?`Развёртка ${+m.dev.toFixed(1)} мм · длина ${m.len} мм · ${m.qty} шт.`:'Введите размеры';
 return`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" width="1120" height="520"><rect width="560" height="260" fill="#fff"/><text x="14" y="26" font-size="15" font-family="Arial,sans-serif" font-weight="700" fill="#18212b">${title}</text><text x="546" y="248" font-size="11" font-family="Arial,sans-serif" text-anchor="end" fill="#8a96a3">${esc(C.name)} · эскиз с сайта</text>${body}</svg>`}

function svgToJpeg(svg){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=1120;c.height=520;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);let q=.85,u=c.toDataURL('image/jpeg',q);while(u.length>200000&&q>.5){q-=.1;u=c.toDataURL('image/jpeg',q)}ok(u)};im.onerror=no;im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)})}

 document.querySelectorAll('#sw [data-k]').forEach(d=>d.classList.toggle('on',d.dataset.k===k));$('hname').innerHTML='<b>RAL '+esc(k)+'</b> · '+r[0]}

/* ===== анимация «от листа до изделия» ===== */
(function(){const svg=$('proc');if(!svg)return;
 const g=id=>svg.querySelector('#'+id),pa=g('pa'),pb=g('pb'),pc=g('pc'),ps=g('ps'),pk=g('pk'),cap=$('pcap');
 const FL=[[300,100],[335,100],[435,100],[470,100]],BE=[[335,62],[335,100],[435,100],[435,62]],CAPS=['1 · Лист металла','2 · Раскрой по размеру','3 · Гибка на станке','4 · Готовое изделие'];
 const lerp=(a,b,t)=>a+(b-a)*t,cl=t=>Math.max(0,Math.min(1,t)),ez=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
 function frame(T){let st=0,bw=0,cx=20,co=0,so=.0,bo=1,ps_=1,bt=0,sh=1,ko=0,col='#f07824';
  if(T<1.6){st=0;sh=T<.3?lerp(.3,1,T/.3):1}
  else if(T<3.6){st=1;const p=(T-1.6)/2;bw=230*p;cx=20+230*p;co=1}
  else if(T<4.6){st=1;bw=230;const p=T-3.6;bo=1-p;so=p;sh=lerp(1,.3,p)}
  else if(T<6.6){st=2;bw=230;bo=0;so=1;sh=.3;bt=ez((T-4.6)/2)}
  else if(T<8.6){st=3;bw=230;bo=0;so=1;sh=.3;bt=1;ko=cl((T-6.6)/.5);col='#1e7a46'}
  else{st=3;bw=230;bo=0;sh=.3;bt=1;so=1-cl((T-8.6)/.4);ko=so;col='#1e7a46'}
  pa.setAttribute('opacity',sh);pb.setAttribute('width',bw);pb.setAttribute('opacity',bo);pc.setAttribute('x1',cx);pc.setAttribute('x2',cx);pc.setAttribute('opacity',co);
  ps.setAttribute('points',FL.map((p,i)=>lerp(p[0],BE[i][0],bt).toFixed(1)+','+lerp(p[1],BE[i][1],bt).toFixed(1)).join(' '));ps.setAttribute('opacity',so);ps.setAttribute('stroke',col);pk.setAttribute('opacity',ko);
  if(cap.textContent!==CAPS[st])cap.textContent=CAPS[st]}
 if(matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){frame(7.5);return}
 const sec=$('s-steps');(function loop(ms){if(sec.classList.contains('open')){frame(ms%9500/1000);requestAnimationFrame(loop)}else setTimeout(()=>requestAnimationFrame(loop),400)})(0)})();
